<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BYD Automobile World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050811;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Animated AI Mesh Background */
        .ai-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 168, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 255, 204, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(10, 15, 30, 0.9) 0%, #050811 100%);
            overflow: hidden;
        }

        /* Floating AI Particles */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(0, 255, 204, 0.6);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.8);
            animation: float 12s infinite ease-in-out;
        }

        .particle:nth-child(1) { width: 6px; height: 6px; top: 20%; left: 15%; animation-duration: 8s; }
        .particle:nth-child(2) { width: 10px; height: 10px; top: 60%; left: 80%; animation-duration: 12s; animation-delay: -2s; }
        .particle:nth-child(3) { width: 4px; height: 4px; top: 75%; left: 35%; animation-duration: 10s; animation-delay: -4s; }
        .particle:nth-child(4) { width: 8px; height: 8px; top: 30%; left: 70%; animation-duration: 14s; animation-delay: -6s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
            50% { transform: translateY(-40px) translateX(20px); opacity: 1; }
        }

        /* Animated Grid Overlay */
        .ai-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image: 
                linear-gradient(to right, rgba(0, 168, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 168, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg);
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
        }

        /* Header Navigation */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 8, 17, 0.75);
            backdrop-filter: blur(12px);
            padding: 20px 50px;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            border-bottom: 1px solid rgba(0, 168, 255, 0.2);
            animation: slideDown 1s ease-out;
        }

        .logo {
            color: #ffffff;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 3px;
            text-decoration: none;
            border: 2px solid #00f0ff;
            padding: 4px 12px;
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            transition: all 0.4s ease;
        }

        .logo:hover {
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
            transform: scale(1.05);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 35px;
        }

        .nav-links a {
            color: #c0c8d0;
            text-decoration: none;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
            padding: 5px 0;
            transition: color 0.3s ease;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #00a8ff, #00ffcc);
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: #00ffcc;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* Hero Section */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 120px 20px 60px 20px;
        }

        .hero-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 255, 204, 0.2);
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 850px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                        inset 0 0 20px rgba(0, 255, 204, 0.05);
            animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .car-image-container {
            position: relative;
            width: 100%;
            max-width: 650px;
            margin: 0 auto 30px auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 168, 255, 0.3);
            animation: zoomIn 1.4s ease-out;
        }

        .car-image {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.6s ease;
        }

        .car-image-container:hover .car-image {
            transform: scale(1.05);
        }

        .hero h1 {
            font-size: 44px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #ffffff, #00ffcc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
        }

        .hero p {
            font-size: 17px;
            line-height: 1.8;
            margin-bottom: 35px;
            color: #a0aec0;
        }

        /* Animated Button */
        .btn-explore {
            position: relative;
            display: inline-block;
            padding: 14px 40px;
            color: #050811;
            background: linear-gradient(90deg, #00a8ff, #00ffcc);
            text-decoration: none;
            font-size: 15px;
            font-weight: 800;
            border-radius: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            transition: all 0.4s ease;
        }

        .btn-explore:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 35px rgba(0, 255, 204, 0.8);
            background: linear-gradient(90deg, #00ffcc, #00a8ff);
        }

        /* Entrance Animations */
        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeInUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes zoomIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="ai-background">
        <div class="ai-grid"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <header>
        <nav class="navbar">
            <a href="#" class="logo">BYD</a>
            <ul class="nav-links">
                <li><a href="#history">History</a></li>
                <li><a href="#technology">Technology</a></li>
                <li><a href="#models">Models</a></li>
                <li><a href="#company">Company</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-card">
            <div class="car-image-container">
                <img class="car-image" src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1600&q=80" alt="BYD Electric Car">
            </div>
            <h1>BYD Automobile World</h1>
            <p>Pioneering the future of intelligent sustainable mobility. Powered by next-generation Blade Battery innovation and dynamic AI performance, BYD drives zero-emission technology forward for a smarter tomorrow.</p>
            <a href="#explore" class="btn-explore">Explore More</a>
        </div>
    </section>

</body>
</html>
